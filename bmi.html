<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>BMI Calculator</title>

  <link rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="navbar">

  <a href="index.html">Home</a>

  <a href="bmi.html">BMI</a>

  <a href="tracker.html">Tracker</a>

  <a href="insights.html">Insights</a>

  < <a href="nutrition.html">Nutrition</a>


</div>

<div class="container">

  <h1>BMI Calculator</h1>

  <div class="card">

    <input type="number"
           id="height"
           placeholder="Height in cm">

    <input type="number"
           id="weight"
           placeholder="Weight in kg">

    <input type="number"
           id="targetWeight"
           placeholder="Target Weight">

    <button onclick="calculateBMI()">
      Calculate
    </button>

  </div>

  <div class="stats">

    <div class="stat-box">
      <h3>BMI</h3>
      <p id="bmiResult">0</p>
    </div>

    <div class="stat-box">
      <h3>Weight To Lose</h3>
      <p id="weightLoss">0 kg</p>
    </div>

  </div>

  <div class="card">

    <h2>Insights</h2>

    <div id="healthInsights"></div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
